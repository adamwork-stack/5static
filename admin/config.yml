# Decap CMS Configuration
# Update backend.repo and site_url for your deployment

# Replace owner/repo with your GitHub org/repo (e.g. yourorg/cybersecurity-site)
# For Cloudflare Pages: deploy decap-proxy Worker and set base_url. See README.
backend:
  name: github
  repo: owner/repo
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://yoursite.com  # Replace with production URL
display_url: https://yoursite.com

collections:
  - label: "Settings"
    name: "settings"
    files:
      - label: "Site Settings"
        name: "settings"
        file: "content/settings.json"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Footer Text", name: "footer_copy", widget: "string" }

  - label: "Home"
    name: "home"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Hero CTA Text", name: "hero_cta_text", widget: "string" }
          - { label: "Value Props Heading", name: "value_props_heading", widget: "string" }
          - { label: "Value Props Intro", name: "value_props_intro", widget: "string" }
          - { label: "Value Prop 1 Title", name: "value_prop_1_title", widget: "string" }
          - { label: "Value Prop 1 Description", name: "value_prop_1_desc", widget: "text" }
          - { label: "Value Prop 2 Title", name: "value_prop_2_title", widget: "string" }
          - { label: "Value Prop 2 Description", name: "value_prop_2_desc", widget: "text" }
          - { label: "Value Prop 3 Title", name: "value_prop_3_title", widget: "string" }
          - { label: "Value Prop 3 Description", name: "value_prop_3_desc", widget: "text" }
          - { label: "CTA Heading", name: "cta_heading", widget: "string" }
          - { label: "CTA Text", name: "cta_text", widget: "text" }

  - label: "About"
    name: "about"
