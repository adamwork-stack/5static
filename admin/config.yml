      - label: "About Page"
        name: "about"
        file: "content/about.json"
        fields:
          - { label: "Hero Title", name: "about_hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "about_hero_subtitle", widget: "text" }
          - { label: "Mission Title", name: "mission_title", widget: "string" }
          - { label: "Mission Text", name: "mission_text", widget: "text" }
          - { label: "Story Title", name: "story_title", widget: "string" }
          - { label: "Story Paragraph 1", name: "story_para_1", widget: "text" }
          - { label: "Story Paragraph 2", name: "story_para_2", widget: "text" }
          - { label: "Story Paragraph 3", name: "story_para_3", widget: "text" }
          - { label: "CTA Title", name: "about_cta_title", widget: "string" }
          - { label: "CTA Text", name: "about_cta_text", widget: "text" }
          - { label: "CTA Button", name: "about_cta_btn", widget: "string" }

  - label: "Services"
